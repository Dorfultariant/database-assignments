services:
  frontend:
    build:
      context: ./Frontend

    stdin_open: true
    tty: true

    networks:
      - application

    depends_on:
      db-auth:
        condition: service_healthy
      db-music:
        condition: service_healthy
      db-gigs:
        condition: service_healthy

  db-auth:
    image: postgres:16-alpine
    container_name: smoothtune-db-auth

    environment:
      POSTGRES_USER: teppo
      POSTGRES_PASSWORD: teppo
      POSTGRES_DB: auth

    volumes:
      - pg_data_auth:/var/lib/postgresql/data
      - ./Database/init/auth:/docker-entrypoint-initdb.d

    networks:
      - application

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U teppo -d auth"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  db-music:
    image: postgres:16-alpine
    container_name: smoothtune-db-music

    environment:
      POSTGRES_USER: teppo
      POSTGRES_PASSWORD: teppo
      POSTGRES_DB: music

    volumes:
      - pg_data_music:/var/lib/postgresql/data
      - ./Database/init/music:/docker-entrypoint-initdb.d

    networks:
      - application

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U teppo -d music"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  db-gigs:
    image: postgres:16-alpine
    container_name: smoothtune-db-gigs

    environment:
      POSTGRES_USER: teppo
      POSTGRES_PASSWORD: teppo
      POSTGRES_DB: gigs

    volumes:
      - pg_data_gigs:/var/lib/postgresql/data
      - ./Database/init/gigs:/docker-entrypoint-initdb.d

    networks:
      - application

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U teppo -d gigs"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pg_data_auth:
  pg_data_music:
  pg_data_gigs:

networks:
  application:
    driver: bridge
