services:
  backend:
    image: node:22-alpine
    container_name: smoothtune-backend
    working_dir: /app

    command: sh -c "npm install && npm run dev"

    volumes:
      - ./Backend:/app
      - backend_node_modules:/app/node_modules

    ports:
      - "3001:3001"

    environment:
      NODE_ENV: development
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET}

      DB_MUSIC_HOST: db-music
      DB_MUSIC_PORT: 5432
      DB_MUSIC_NAME: ${POSTGRES_DB}
      DB_MUSIC_USER: ${POSTGRES_USER}
      DB_MUSIC_PASSWORD: ${POSTGRES_PASSWORD}

      DB_GIGS_HOST: db-gigs
      DB_GIGS_PORT: 5432
      DB_GIGS_NAME: ${POSTGRES_DB}
      DB_GIGS_USER: ${POSTGRES_USER}
      DB_GIGS_PASSWORD: ${POSTGRES_PASSWORD}

      DB_MESSAGES_HOST: db-messages
      DB_MESSAGES_PORT: 5432
      DB_MESSAGES_NAME: ${POSTGRES_DB}
      DB_MESSAGES_USER: ${POSTGRES_USER}
      DB_MESSAGES_PASSWORD: ${POSTGRES_PASSWORD}

    networks:
      - application

    depends_on:
      db-music:
        condition: service_healthy
      db-gigs:
        condition: service_healthy
      db-messages:
        condition: service_healthy

  # frontend:
  #   image: node:22-alpine
  #   container_name: hellticket-frontend
  #   working_dir: /app
  #
  #   command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
  #
  #   volumes:
  #     - ./Frontend:/app
  #     - frontend_node_modules:/app/node_modules
  #
  #   ports:
  #     - "5173:5173"
  #
  #   environment:
  #     # VITE_API_URL: http://localhost:3001
  #
  #   networks:
  #     - application
  #
  #   depends_on:
  #     backend:
  #       condition: service_started
  #

  db-music:
    image: postgres:16-alpine
    container_name: smoothtune-db-music

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - pg_data_music:/var/lib/postgresql/data
      - ./Database/init/music:/docker-entrypoint-initdb.d

    networks:
      - application

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  db-gigs:
    image: postgres:16-alpine
    container_name: smoothtune-db-gigs

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - pg_data_gigs:/var/lib/postgresql/data
      - ./Database/init/gigs:/docker-entrypoint-initdb.d

    networks:
      - application

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  db-messages:
    image: postgres:16-alpine
    container_name: smoothtune-db-messages

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - pg_data_messages:/var/lib/postgresql/data
      - ./Database/init/messages:/docker-entrypoint-initdb.d

    networks:
      - application

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  backend_node_modules:
  frontend_node_modules:

  pg_data_music:
  pg_data_gigs:
  pg_data_messages:

networks:
  application:
    driver: bridge
